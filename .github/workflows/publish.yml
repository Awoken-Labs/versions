name: Publish version

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        default: fxmanifest.lua
        description: Path to fxmanifest.lua in the calling repo.
      name:
        type: string
        default: ''
        description: Published file name. Defaults to the calling repo's name.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: read
        run: |
          # Either quote style: fxmanifest.lua accepts both, and manifests derived from
          # open-source upstreams (illenium-appearance and friends) use double quotes.
          #
          # awoken_version wins where it exists. A resource that `provide`s another
          # resource's name must put the impersonated version in `version`, because that
          # is the field ox_lib's checkDependency reads, which leaves it no place of its
          # own. awoken_interact is the first: it answers as ox_target 1.18.2.
          version=$(grep -oPm1 "^awoken_version\s+[\"']\K[^\"']+" "${{ inputs.manifest }}" || true)
          if [ -z "$version" ]; then
            version=$(grep -oPm1 "^version\s+[\"']\K[^\"']+" "${{ inputs.manifest }}")
          fi
          [ -n "$version" ] || { echo "no version in ${{ inputs.manifest }}"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: Awoken-Labs/versions
          ssh-key: ${{ secrets.VERSIONS_DEPLOY_KEY }}
          path: .versions

      - env:
          VERSION: ${{ steps.read.outputs.version }}
          NAME: ${{ inputs.name }}
        run: |
          name="${NAME:-${GITHUB_REPOSITORY#*/}}"
          cd .versions
          echo "$VERSION" > "$name.txt"
          git config user.name  'awoken-labs-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add "$name.txt"
          git diff --cached --quiet && { echo "$name already at $VERSION"; exit 0; }
          git commit -m "$name $VERSION"
          # ponytail: one rebase-retry covers two repos releasing at once; if that ever
          # starts losing races, add a concurrency group instead of a retry loop.
          git push || { git pull --rebase && git push; }
